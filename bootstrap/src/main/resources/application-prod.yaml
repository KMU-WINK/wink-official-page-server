spring:
  config:
    import:
      - classpath:application-default.yaml

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  recruit:
    privacy:
      encryption-key: ${RECRUIT_PII_ENCRYPTION_KEY}

sentry:
  dsn: ${SENTRY_DSN:}
  max-request-body-size: NONE
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
