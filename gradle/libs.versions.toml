[versions]
aws-sdk = "2.49.5"
awspring = "4.1.0"
jadenticon = "3.0.4"
java-jwt = "4.6.0"
jsoup = "1.22.2"
kotlin = "2.4.10"
sentry = "6.16.0"
sentry-runtime = "8.50.1"
spring-boot = "4.1.0"
springdoc = "3.0.3"

[libraries]
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
awspring-cloud-dependencies = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "awspring" }
jadenticon = { module = "com.github.atomfrede:jadenticon", version.ref = "jadenticon" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-sentry = { module = "io.sentry:sentry-spring-boot-4-starter", version.ref = "sentry-runtime" }
sentry-core = { module = "io.sentry:sentry", version.ref = "sentry-runtime" }
spring-cloud-aws-starter-s3 = { module = "io.awspring.cloud:spring-cloud-aws-starter-s3" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
